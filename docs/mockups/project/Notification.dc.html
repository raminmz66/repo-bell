<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RepoBell desktop notifications</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;font-family:'Ubuntu',system-ui,sans-serif;color:#1B1B1F}
a{color:#1F5FD1}a:hover{color:#174AA6}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1000px; height: 420px; box-sizing: border-box; padding: 32px 40px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 40px; background: #F6F6F4; font-family: 'Ubuntu', system-ui, sans-serif; color: #1B1B1F">

  <section style="display: flex; flex-direction: column; gap: 12px">
    <div>
      <h2 style="margin: 0; font-size: 15px; font-weight: 700">One repo has news</h2>
      <p style="margin: 2px 0 0; font-size: 13px; color: #5B5B66">Click opens RepoBell on that repo.</p>
    </div>
    <div style="height: 260px; border-radius: 10px; overflow: hidden; background: #E9E6E1; border: 1px solid #D9D9D5; display: flex; flex-direction: column">
      <div style="height: 28px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #1D1D1D; color: #F2F2F2; font-size: 12px; font-weight: 500">Fri 6 Nov 21:15</div>
      <div style="display: flex; justify-content: center; padding-top: 10px">
        <button style="width: 360px; display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border: none; border-radius: 12px; background: #2E2E2E; color: #F2F2F2; text-align: left; cursor: pointer">
          <span style="width: 32px; height: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #3D3D3D">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F2F2F2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
          </span>
          <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
            <span style="font-size: 12px; color: #C8C8C8">RepoBell · now</span>
            <span style="font-size: 14px; font-weight: 700">web-app: 4 new changes</span>
            <span style="font-size: 13px; line-height: 1.4; color: #DADADA">Sara added 4 changes to the main version. Fix login timeout, and 3 more.</span>
          </span>
        </button>
      </div>
    </div>
  </section>

  <section style="display: flex; flex-direction: column; gap: 12px">
    <div>
      <h2 style="margin: 0; font-size: 15px; font-weight: 700">Several repos have news</h2>
      <p style="margin: 2px 0 0; font-size: 13px; color: #5B5B66">One notification per check, never one per change. Click opens RepoBell.</p>
    </div>
    <div style="height: 260px; border-radius: 10px; overflow: hidden; background: #E9E6E1; border: 1px solid #D9D9D5; display: flex; flex-direction: column">
      <div style="height: 28px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #1D1D1D; color: #F2F2F2; font-size: 12px; font-weight: 500">Fri 6 Nov 21:15</div>
      <div style="display: flex; justify-content: center; padding-top: 10px">
        <button style="width: 360px; display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border: none; border-radius: 12px; background: #2E2E2E; color: #F2F2F2; text-align: left; cursor: pointer">
          <span style="width: 32px; height: 32px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #3D3D3D">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F2F2F2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
          </span>
          <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
            <span style="font-size: 12px; color: #C8C8C8">RepoBell · now</span>
            <span style="font-size: 14px; font-weight: 700">3 repos have news</span>
            <span style="font-size: 13px; line-height: 1.4; color: #DADADA">web-app, design-system and api-server. 6 new changes in total.</span>
          </span>
        </button>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1000,"height":420}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
