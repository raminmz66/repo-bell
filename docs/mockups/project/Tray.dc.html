<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RepoBell tray menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;font-family:'Ubuntu',system-ui,sans-serif;color:#1B1B1F}
a{color:#1F5FD1}a:hover{color:#174AA6}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 560px; height: 560px; box-sizing: border-box; display: flex; flex-direction: column; background: #E9E6E1; font-family: 'Ubuntu', system-ui, sans-serif; color: #1B1B1F">

  <div style="height: 32px; flex-shrink: 0; display: flex; align-items: center; gap: 14px; padding: 0 12px; background: #1D1D1D; color: #F2F2F2; font-size: 13px">
    <span>Activities</span>
    <span style="flex-grow: 1; text-align: center; font-weight: 500">Fri 6 Nov 21:15</span>
    <span style="display: flex; align-items: center; justify-content: center; width: 30px; height: 26px; border-radius: 6px; background: #3A3A3A; position: relative">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F2F2F2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="RepoBell, news"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path><circle cx="19" cy="5" r="3.5" fill="#E8553D" stroke="#1D1D1D" stroke-width="1.5"></circle></svg>
    </span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F2F2F2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"></path><circle cx="12" cy="19.5" r="0.6"></circle></svg>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F2F2F2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg>
  </div>

  <div style="display: flex; justify-content: flex-end; padding: 6px 54px 0 0">
    <ul role="menu" aria-label="RepoBell" style="width: 330px; margin: 0; padding: 6px; list-style: none; background: #2E2E2E; color: #F2F2F2; border-radius: 12px; font-size: 14px; display: flex; flex-direction: column">
      <li role="none" style="padding: 10px 12px 8px; font-weight: 700">3 repos have news</li>
      <li role="separator" style="height: 1px; margin: 4px 8px; background: #474747"></li>
      <li role="none"><button role="menuitem" style="width: 100%; min-height: 40px; padding: 8px 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; border: none; border-radius: 8px; background: #3D3D3D; color: #F2F2F2; font-size: 14px; text-align: left; cursor: pointer"><span>web-app</span><span style="font-size: 12px; color: #C8C8C8">Behind by 4</span></button></li>
      <li role="none"><button role="menuitem" style="width: 100%; min-height: 40px; padding: 8px 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; border: none; border-radius: 8px; background: transparent; color: #F2F2F2; font-size: 14px; text-align: left; cursor: pointer"><span>design-system</span><span style="font-size: 12px; color: #C8C8C8">Behind by 1, has unsaved changes</span></button></li>
      <li role="none"><button role="menuitem" style="width: 100%; min-height: 40px; padding: 8px 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; border: none; border-radius: 8px; background: transparent; color: #F2F2F2; font-size: 14px; text-align: left; cursor: pointer"><span>api-server</span><span style="font-size: 12px; color: #C8C8C8">Behind by 1</span></button></li>
      <li role="separator" style="height: 1px; margin: 4px 8px; background: #474747"></li>
      <li role="none"><button role="menuitem" style="width: 100%; height: 40px; padding: 0 12px; border: none; border-radius: 8px; background: transparent; color: #F2F2F2; font-size: 14px; text-align: left; cursor: pointer">Open RepoBell</button></li>
      <li role="none"><button role="menuitem" style="width: 100%; height: 40px; padding: 0 12px; border: none; border-radius: 8px; background: transparent; color: #F2F2F2; font-size: 14px; text-align: left; cursor: pointer">Check now</button></li>
      <li role="none"><button role="menuitem" style="width: 100%; height: 40px; padding: 0 12px; border: none; border-radius: 8px; background: transparent; color: #F2F2F2; font-size: 14px; text-align: left; cursor: pointer">Mark all as seen</button></li>
      <li role="separator" style="height: 1px; margin: 4px 8px; background: #474747"></li>
      <li role="none"><button role="menuitem" style="width: 100%; height: 40px; padding: 0 12px; border: none; border-radius: 8px; background: transparent; color: #F2F2F2; font-size: 14px; text-align: left; cursor: pointer">Quit</button></li>
    </ul>
  </div>

  <div style="margin-top: auto; padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 10px">
    <h2 style="margin: 0; font-size: 14px; font-weight: 700">Icon states</h2>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="width: 36px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: #1D1D1D">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F2F2F2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
        </span>
        <span style="font-size: 13px; color: #3D3D45">All quiet</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="width: 36px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: #1D1D1D">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F2F2F2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path><circle cx="19" cy="5" r="3.5" fill="#E8553D" stroke="#1D1D1D" stroke-width="1.5"></circle></svg>
        </span>
        <span style="font-size: 13px; color: #3D3D45">News</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="width: 36px; height: 30px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: #1D1D1D">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F2F2F2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-9.3-5"></path><path d="M6 8c0 7-3 9-3 9h14"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path><path d="M3 3l18 18"></path></svg>
        </span>
        <span style="font-size: 13px; color: #3D3D45">Can't check</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":560,"height":560}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
