name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches app version
        run: |
          version=$(jq -r .version app/src-tauri/tauri.conf.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in tauri.conf.json" >&2
            exit 1
          fi
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build
        working-directory: app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          npm ci
          npm run tauri build -- --config '{"bundle":{"createUpdaterArtifacts":true}}' 2>&1 | tee build.log
          if grep -E "does not match the public key|Failed to add bundler type" build.log; then exit 1; fi
      - name: Release notes
        run: |
          git fetch --force origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ]; then
            git tag -l --format='%(contents:subject)%0a%(contents:body)' "$GITHUB_REF_NAME" > notes.txt
          else
            : > notes.txt
          fi
      - name: Release files
        run: scripts/release-files.sh "$GITHUB_REF_NAME" notes.txt "https://github.com/raminmz66/repo-bell/releases/download/$GITHUB_REF_NAME" release-files
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body_path: notes.txt
          files: release-files/*
