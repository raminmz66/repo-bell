[package]
name = "repobell"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "RepoBell desktop app"

[lib]
name = "repobell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync"] }
repobell-core = { path = "../../crates/core" }
tauri-plugin-updater = "2.14"

[dev-dependencies]
tempfile = "3"
